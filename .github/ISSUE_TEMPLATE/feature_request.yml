---
name: Feature request
description: Suggest a new option or behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the collection does not allow today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Option name, example configuration, expected hosts or groups...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: For example `compose`, `groups` or `keyed_groups` configurations you tried.
